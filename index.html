<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dennis Wijers is a technology and program leader working across space, AI, cloud, and national security.">
  <meta name="theme-color" content="#f4f2ed">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denniswijers.com/">
  <meta property="og:title" content="Dennis Wijers">
  <meta property="og:description" content="Technology and program leader working across space, AI, cloud, and national security.">
  <meta property="og:image" content="https://denniswijers.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://denniswijers.com/">
  <title>Dennis Wijers</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f2ed;
      --text: #1e1e1b;
      --muted: #5f5e58;
      --line: #cbc8bf;
      --focus: #245a87;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: clamp(48px, 9vw, 112px) clamp(24px, 7vw, 96px);
    }

    .intro {
      width: min(100%, 760px);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 650;
      line-height: 1;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 650px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(20px, 2.4vw, 28px);
      line-height: 1.45;
      letter-spacing: -0.022em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 34px;
      margin-top: clamp(46px, 7vw, 72px);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 150ms ease, color 150ms ease;
    }

    a:hover {
      border-color: var(--text);
    }

    a:focus-visible {
      border-color: transparent;
      border-radius: 2px;
      outline: 3px solid var(--focus);
      outline-offset: 5px;
    }

    @media (max-width: 520px) {
      main {
        align-items: end;
        padding-bottom: 64px;
      }

      nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <h1>Dennis Wijers</h1>
      <p>Technology and program leader working across space, AI, cloud, and national security.</p>
      <nav aria-label="Primary links">
        <a href="https://www.linkedin.com/in/denniswijers/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="/about">About my work</a>
      </nav>
    </div>
  </main>
</body>
</html>
